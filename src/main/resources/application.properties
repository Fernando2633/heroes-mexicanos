# ─── Server ───────────────────────────────────────────────────────────────────
# Render inyecta PORT automáticamente
server.port=${PORT:8080}

# ─── Spring App Name ──────────────────────────────────────────────────────────
spring.application.name=practica-heroes-mexicanos

# ─── Base de Datos ────────────────────────────────────────────────────────────
# LOCAL (default): H2 en memoria
# RENDER:  las variables DATABASE_URL / DB_USERNAME / DB_PASSWORD se configuran
#          en el dashboard de Render > Environment > Add from Database.

spring.datasource.url=${DB_URL:jdbc:h2:mem:heroes_mexicanos;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# ─── H2 Console (solo desarrollo local) ──────────────────────────────────────
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# Dialecto: se detecta automáticamente desde el driver en el classpath.
# Si hubiera ambigüedad descomenta la línea correspondiente:
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ─── SQL Seed Data ────────────────────────────────────────────────────────────
# "embedded" → solo se ejecuta en bases en memoria (H2 local).
# En producción (PostgreSQL en Render) Hibernate crea la tabla vacía y el
# seed NO se dispara, evitando duplicados en reinicios.
spring.sql.init.mode=${SQL_INIT_MODE:embedded}
spring.sql.init.data-locations=classpath:data.sql
