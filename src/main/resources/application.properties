# ─── Server ───────────────────────────────────────────────────────────────────
# Render inyecta la variable PORT automáticamente
server.port=${PORT:8080}

# ─── Spring App Name ──────────────────────────────────────────────────────────
spring.application.name=practica-heroes-mexicanos

# ─── Base de Datos ────────────────────────────────────────────────────────────
# Si las variables de entorno DB_URL / DB_USERNAME / DB_PASSWORD están definidas
# (ej. en Render con una base MySQL externa) se usarán esas.
# Si no, el fallback es H2 en memoria (perfecto para desarrollo local y demo).

spring.datasource.url=${DB_URL:jdbc:h2:mem:heroes_mexicanos;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Driver: se detecta automáticamente desde la URL.
# Para MySQL agrega:  spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# ─── H2 Console (solo útil en local; en producción se puede deshabilitar) ─────
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# ─── SQL Seed Data ────────────────────────────────────────────────────────────
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
