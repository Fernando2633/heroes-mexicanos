server.port=8080

# Spring Application Name
spring.application.name=practica-heroes-mexicanos

# Database Configuration (MySQL as primary, H2 in-memory default fallback for out-of-the-box running)
spring.datasource.url=jdbc:h2:mem:heroes_mexicanos;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# SQL Seed Data Initialization
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# Production MySQL Profile reference properties commented for standard local MySQL connection:
# spring.datasource.url=jdbc:mysql://localhost:3306/heroes_mexicanos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
