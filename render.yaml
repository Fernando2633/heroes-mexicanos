# render.yaml — Configuración de despliegue para Render.com

services:
  - type: web
    name: heroes-mexicanos
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free

    envVars:
      # Render inyecta DATABASE_URL automáticamente cuando se vincula una BD.
      # El entrypoint.sh lo convierte de postgresql:// → jdbc:postgresql://
      - key: DATABASE_URL
        fromDatabase:
          name: actividad4          # ← nombre exacto de tu BD en el dashboard
          property: connectionString

    # Render verifica este endpoint antes de marcar el deploy como exitoso
    healthCheckPath: /api/v1/heroes

    autoDeploy: true
    branch: main

databases:
  - name: actividad4
    plan: free
    databaseName: heroes_mexicanos
