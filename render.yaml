# render.yaml — Configuración de despliegue para Render.com
# Documentación: https://render.com/docs/render-yaml-spec

services:
  - type: web
    name: heroes-mexicanos
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free

    envVars:
      # ── Conecta el Web Service a la BD PostgreSQL de Render ────────────────
      # Render convierte "fromDatabase.property" a la variable de entorno
      # DB_URL / DB_USERNAME / DB_PASSWORD automáticamente al hacer deploy.
      - key: DB_URL
        fromDatabase:
          name: actividad4            # ← nombre exacto de tu DB en Render
          property: connectionString  # formato: jdbc:postgresql://host/db

      - key: DB_USERNAME
        fromDatabase:
          name: actividad4
          property: user

      - key: DB_PASSWORD
        fromDatabase:
          name: actividad4
          property: password

      # Desactiva H2 console y el seed SQL en producción
      - key: H2_CONSOLE
        value: "false"

      - key: SQL_INIT_MODE
        value: "never"

    # Render verifica que la app responda antes de marcarla como online
    healthCheckPath: /api/v1/heroes

    # Auto-deploy cuando hay push a main
    autoDeploy: true
    branch: main

databases:
  - name: actividad4               # ← debe coincidir con el nombre de tu DB en Render
    plan: free
    databaseName: heroes_mexicanos
